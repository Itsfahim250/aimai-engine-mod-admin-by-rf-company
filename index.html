<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>RF License Admin</title>
<style>
:root{
  --bg:#08080a;--surface:#111116;--surface2:#17171d;--surface3:#1d1d25;--text:#f7f7fa;--muted:#9b9ba7;
  --border:#272733;--primary:#a855f7;--primary2:#7c3aed;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;
  --shadow:0 16px 50px rgba(0,0,0,.34);--radius:18px;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body.light{--bg:#f5f6f9;--surface:#fff;--surface2:#f0f1f5;--surface3:#e8e9ef;--text:#17171c;--muted:#6f7180;--border:#dcdee7;--shadow:0 14px 40px rgba(40,42,60,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}input,select,textarea{outline:0}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}.app{width:100%;height:100%;display:flex;background:var(--bg)}
/* AUTH */
.auth{width:100%;height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--primary) 20%,transparent),transparent 38%),var(--bg)}
.auth-card{width:min(430px,100%);padding:28px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.brand-mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--primary) 28%,transparent)}
.brand h1{font-size:22px}.brand p{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px}.auth-card h2{font-size:25px;margin-bottom:7px}.auth-card .sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:22px}
.field{margin-bottom:15px}.field label{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--muted);display:block;margin-bottom:7px}.input-wrap{position:relative}.input-wrap input{width:100%;height:50px;border:1px solid var(--border);border-radius:14px;background:var(--surface2);color:var(--text);padding:0 46px 0 15px}.input-wrap input:focus{border-color:var(--primary)}.input-action{position:absolute;right:7px;top:7px;width:36px;height:36px;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.primary{width:100%;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:800}.auth-foot{text-align:center;color:var(--muted);font-size:11px;margin-top:17px}
/* MAIN */
.sidebar{width:245px;border-right:1px solid var(--border);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column}.side-brand{padding:7px 8px 20px;display:flex;gap:11px;align-items:center}.mini-mark{width:36px;height:36px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff}.side-brand strong{font-size:15px}.side-brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;margin-top:2px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:11px;width:100%;background:transparent;color:var(--muted);padding:12px 11px;border-radius:12px;text-align:left;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text)}.nav button.active svg{color:var(--primary)}.side-bottom{margin-top:auto}.side-bottom button{width:100%;display:flex;align-items:center;gap:11px;padding:12px;background:transparent;color:var(--muted);border-radius:12px;text-align:left}.side-bottom button:hover{background:var(--surface2);color:var(--text)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:74px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface)}.top-left h2{font-size:19px}.top-left p{font-size:11px;color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:9px}.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:12px;display:grid;place-items:center}.icon-btn:hover{color:var(--text);border-color:var(--primary)}
.main{flex:1;overflow:auto;padding:22px}.page{display:none}.page.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:17px;background:var(--surface);border:1px solid var(--border);border-radius:17px}.stat .row{display:flex;align-items:center;justify-content:space-between}.stat .icon{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary)}.stat small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:8px}.stat strong{font-size:24px}.stat span{font-size:10px;color:var(--muted)}
.section{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:19px;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}.section-head h3{font-size:14px}.section-head p{font-size:11px;color:var(--muted);margin-top:3px}.actions-row{display:flex;flex-wrap:wrap;gap:9px}.btn{min-height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:var(--primary)}.btn.primary2{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn.ghost{background:transparent;color:var(--muted)}
/* users */
.toolbar{display:flex;gap:9px;align-items:center;padding:15px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}.search{flex:1;min-width:200px;position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--muted);width:18px;height:18px}.search input{width:100%;height:40px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:0 12px 0 38px;color:var(--text);font-size:12px}.filter{height:40px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:0 10px;color:var(--text);font-size:11px}.bulkbar{display:none;padding:10px 16px;background:color-mix(in srgb,var(--primary) 8%,var(--surface));border-bottom:1px solid var(--border);align-items:center;gap:8px}.bulkbar.show{display:flex}.bulkbar span{font-size:11px;color:var(--muted);margin-right:auto}
.users{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}.user-card{border:1px solid var(--border);background:var(--surface2);border-radius:16px;padding:14px;position:relative}.user-head{display:flex;gap:11px;align-items:center}.check{width:18px;height:18px;accent-color:var(--primary)}.avatar{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--primary) 14%,transparent);display:grid;place-items:center;color:var(--primary);flex:none}.u-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{margin-left:auto;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900}.badge.active{background:rgba(34,197,94,.13);color:var(--success)}.badge.expired{background:rgba(239,68,68,.13);color:var(--danger)}.badge.soon{background:rgba(245,158,11,.13);color:var(--warning)}.card-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.info{padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px}.info small{display:block;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.7px;margin-bottom:4px}.info b{font-size:11px;word-break:break-word}.card-actions{display:flex;gap:7px;margin-top:10px}.mini-btn{height:34px;flex:1;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}.mini-btn:hover{color:var(--text);border-color:var(--primary)}.mini-btn.red{color:var(--danger)}
/* activity/settings */
.list{display:flex;flex-direction:column}.list-item{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}.list-item:last-child{border-bottom:0}.list-item svg{color:var(--primary);flex:none;margin-top:2px}.list-item strong{font-size:12px}.list-item p{color:var(--muted);font-size:10px;margin-top:3px}.empty{padding:45px 15px;text-align:center;color:var(--muted);font-size:12px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-card{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:18px}.settings-card h3{font-size:13px;margin-bottom:4px}.settings-card>p{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:16px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-top:1px solid var(--border)}.setting-row:first-of-type{border-top:0}.setting-row strong{font-size:11px}.setting-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.switch{position:relative;width:42px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border);border-radius:99px}.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}.switch input:checked+.slider{background:color-mix(in srgb,var(--primary) 28%,var(--surface3));border-color:var(--primary)}.switch input:checked+.slider:before{transform:translateX(18px);background:var(--primary)}.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.theme-chip{height:44px;border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;gap:7px;padding:7px;background:var(--surface2);font-size:9px;font-weight:800;color:var(--text)}.theme-dot{width:19px;height:19px;border-radius:7px;flex:none}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(580px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.modal-head h3{font-size:16px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid .full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--border)}.textarea{min-height:95px;padding:12px!important;resize:vertical}.danger-box{padding:12px;border:1px solid color-mix(in srgb,var(--danger) 25%,var(--border));background:rgba(239,68,68,.06);border-radius:12px;color:var(--muted);font-size:10px;line-height:1.5}
/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:11px 15px;border-radius:12px;box-shadow:var(--shadow);font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* responsive */
@media(max-width:900px){.sidebar{width:74px;padding:14px 9px}.side-brand div:not(.mini-mark),.nav button span,.side-bottom button span,.side-brand small{display:none}.side-brand{justify-content:center}.nav button{justify-content:center;padding:12px}.grid4{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}.users{grid-template-columns:1fr}}
@media(max-width:620px){.sidebar{display:none}.topbar{height:68px;padding:0 15px}.main{padding:13px}.grid4{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:13px}.stat strong{font-size:20px}.toolbar{padding:12px}.search{min-width:100%;}.users{padding:10px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.theme-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="modalOverlay" class="overlay"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const CONFIG={
  DB_URL:'https://pk-straight-default-rtdb.firebaseio.com',
  USERS_NODE:'panel_auth/users',
  META_NODE:'panel_auth/user_meta',
  ADMIN_HASH_KEY:'rf_license_admin_password_hash',
  THEME_KEY:'rf_license_theme',
  PRIMARY_KEY:'rf_license_primary',
  SESSION_KEY:'rf_license_session',
  LOG_KEY:'rf_license_activity_log',
  SETTINGS_KEY:'rf_license_settings',
  SESSION_MINUTES:45
};
let usersData={}, metaData={}, currentEdit=null, selected=new Set(), view='users', theme='dark', primary='#a855f7';
const $=id=>document.getElementById(id);
const root=$('root'), overlay=$('modalOverlay'), toast=$('toast');
const icon=(name)=>({
  grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  users:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><line x1="4" y1="19" x2="4" y2="5"/><line x1="4" y1="19" x2="20" y2="19"/><polyline points="7,15 11,11 14,13 19,7"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.41 1.41-.06-.06A1.65 1.65 0 0 0 16.5 18a1.65 1.65 0 0 0-1 .87 1.65 1.65 0 0 0-.13.63V20h-2v-.5a1.65 1.65 0 0 0-1-1.5 1.65 1.65 0 0 0-1.82.33l-.06.06-1.41-1.41.06-.06A1.65 1.65 0 0 0 8 15.5a1.65 1.65 0 0 0-.87-1 1.65 1.65 0 0 0-.63-.13H6v-2h.5a1.65 1.65 0 0 0 1.5-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06 1.41-1.41.06.06A1.65 1.65 0 0 0 11.5 8a1.65 1.65 0 0 0 1-.87 1.65 1.65 0 0 0 .13-.63V6h2v.5a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.41 1.41-.06.06A1.65 1.65 0 0 0 18 10.5c0 .37.13.73.37 1 .24.27.6.43 1 .43h.5v2h-.5a1.65 1.65 0 0 0-.97.37z"/></svg>',
  logout:'<svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16" y2="16"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6m3 0V4h8v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  download:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
  refresh:'<svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15-4L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15 4l2-2"/><path d="M21 20v-5h-5"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 2 2-2 2 2 2-2 2-2-2-4 4"/></svg>',
  calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>'
}[name]||'');
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[s]));}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function getLogs(){try{return JSON.parse(localStorage.getItem(CONFIG.LOG_KEY)||'[]')}catch{return[]}}
function addLog(action,detail){const logs=getLogs();logs.unshift({time:new Date().toISOString(),action,detail});localStorage.setItem(CONFIG.LOG_KEY,JSON.stringify(logs.slice(0,200)))}
async function hash(v){if(window.crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function isConfigured(){return !!localStorage.getItem(CONFIG.ADMIN_HASH_KEY)}
function setSession(){localStorage.setItem(CONFIG.SESSION_KEY,String(Date.now()))}
function sessionValid(){const s=Number(localStorage.getItem(CONFIG.SESSION_KEY)||0);return s&&Date.now()-s<CONFIG.SESSION_MINUTES*60000}
function logout(){localStorage.removeItem(CONFIG.SESSION_KEY);renderAuth()}
function renderAuth(setup=false){root.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark">${icon('shield')}</div><div><h1>RF License Admin</h1><p>ADVANCED MANAGEMENT PANEL</p></div></div><h2>${setup?'Create Admin Password':'Welcome Back'}</h2><div class="sub">${setup?'Set the local admin password for this browser. You can change it later from Security Settings.':'Enter your local admin password to continue.'}</div><form id="authForm"><div class="field"><label>${setup?'NEW PASSWORD':'ADMIN PASSWORD'}</label><div class="input-wrap"><input id="authPass" type="password" minlength="6" autocomplete="current-password" required placeholder="Enter password"><button type="button" class="input-action" id="authEye">${icon('eye')}</button></div></div>${setup?'<div class="field"><label>CONFIRM PASSWORD</label><div class="input-wrap"><input id="authConfirm" type="password" minlength="6" required placeholder="Confirm password"><button type="button" class="input-action" id="authEye2">'+icon('eye')+'</button></div></div>':''}<button class="primary" type="submit">${setup?'SAVE & CONTINUE':'LOGIN'}</button></form><div class="auth-foot">Local session • Auto logout after ${CONFIG.SESSION_MINUTES} minutes</div></div></div>`;
  $('authEye').onclick=()=>togglePwd('authPass'); if(setup)$('authEye2').onclick=()=>togglePwd('authConfirm'); $('authForm').onsubmit=handleAuth;
}
function togglePwd(id){const el=$(id);el.type=el.type==='password'?'text':'password'}
async function handleAuth(e){e.preventDefault();const pass=$('authPass').value;if(!isConfigured()){if(pass.length<6)return showToast('Password must be at least 6 characters');if(pass!==$('authConfirm').value)return showToast('Passwords do not match');localStorage.setItem(CONFIG.ADMIN_HASH_KEY,await hash(pass));addLog('Admin Setup','Local admin password created');setSession();renderApp();showToast('Admin password created')}else{const saved=localStorage.getItem(CONFIG.ADMIN_HASH_KEY);if(await hash(pass)!==saved)return showToast('Invalid admin password');setSession();addLog('Login','Admin logged in');renderApp()}}
function saveTheme(){localStorage.setItem(CONFIG.THEME_KEY,theme);localStorage.setItem(CONFIG.PRIMARY_KEY,primary);document.body.classList.toggle('light',theme==='light');document.documentElement.style.setProperty('--primary',primary);document.documentElement.style.setProperty('--primary2',shade(primary,-28));}
function shade(hex,p){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+p)),g=Math.max(0,Math.min(255,((n>>8)&255)+p)),b=Math.max(0,Math.min(255,(n&255)+p));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function loadPrefs(){theme=localStorage.getItem(CONFIG.THEME_KEY)||'dark';primary=localStorage.getItem(CONFIG.PRIMARY_KEY)||'#a855f7';saveTheme()}
function renderApp(){loadPrefs();root.innerHTML=`<aside class="sidebar"><div class="side-brand"><div class="mini-mark">${icon('shield')}</div><div><strong>RF ADMIN</strong><small>LICENSE CONTROL</small></div></div><nav class="nav"><button data-view="dashboard">${icon('grid')}<span>Dashboard</span></button><button data-view="users">${icon('users')}<span>Users</span></button><button data-view="stats">${icon('chart')}<span>Statistics</span></button><button data-view="notifications">${icon('bell')}<span>Notifications</span></button><button data-view="settings">${icon('settings')}<span>Settings</span></button></nav><div class="side-bottom"><button id="logoutBtn">${icon('logout')}<span>Logout</span></button></div></aside><section class="content"><div class="topbar"><div class="top-left"><h2 id="topTitle">Dashboard</h2><p id="topSub">License system overview</p></div><div class="top-actions"><button class="icon-btn" id="refreshBtn" title="Refresh">${icon('refresh')}</button><button class="icon-btn" id="topLogout" title="Logout">${icon('logout')}</button></div></div><main class="main"><section id="page-dashboard" class="page"></section><section id="page-users" class="page"></section><section id="page-stats" class="page"></section><section id="page-notifications" class="page"></section><section id="page-settings" class="page"></section></main></section>`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('logoutBtn').onclick=logout;$('topLogout').onclick=logout;$('refreshBtn').onclick=()=>fetchAll(true);navigate('dashboard');fetchAll();
}
async function fetchJSON(path){const r=await fetch(`${CONFIG.DB_URL}/${path}.json`);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
async function fetchAll(manual=false){if(manual)showToast('Refreshing…');try{const [u,m]=await Promise.all([fetchJSON(CONFIG.USERS_NODE),fetchJSON(CONFIG.META_NODE)]);usersData=u||{};metaData=m||{};renderCurrent();renderDashboard();if(manual)showToast('Data refreshed')}catch(e){usersData={};metaData={};renderCurrent();renderDashboard();showToast('Firebase connection failed')}}
function nowStr(){return new Date().toLocaleString()}
function daysUntil(date){if(!date)return Infinity;const d=new Date(date+'T23:59:59');return Math.ceil((d-Date.now())/86400000)}
function statusOf(u){const d=daysUntil(u?.expire_date);return d<0?'expired':d<=7?'soon':'active'}
function counts(){let total=0,active=0,expired=0,soon=0;Object.values(usersData).forEach(u=>{if(!u)return;total++;const s=statusOf(u);if(s==='active')active++;else if(s==='expired')expired++;else soon++});return{total,active,expired,soon}}
function navigate(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));const titles={dashboard:['Dashboard','License system overview'],users:['Users','Manage credentials and expiry'],stats:['Statistics','License health and activity'],notifications:['Notifications','Expiring and expired licenses'],settings:['Settings','Appearance, security and data']};$('topTitle').textContent=titles[v][0];$('topSub').textContent=titles[v][1];renderCurrent();if(v==='dashboard')renderDashboard();if(v==='stats')renderStats();if(v==='notifications')renderNotifications();if(v==='settings')renderSettings()}
function renderCurrent(){if(view==='users')renderUsersPage()}
function statCard(label,val,kind,desc){return `<div class="stat"><div class="row"><div><small>${label}</small><strong>${val}</strong><span>${desc}</span></div><div class="icon">${icon(kind)}</div></div></div>`}
function renderDashboard(){const c=counts();$('page-dashboard').innerHTML=`<div class="grid4">${statCard('TOTAL USERS',c.total,'users','All licenses')}${statCard('ACTIVE',c.active,'shield','More than 7 days')}${statCard('EXPIRING SOON',c.soon,'bell','7 days or less')}${statCard('EXPIRED',c.expired,'calendar','Past expiry date')}</div><div class="section"><div class="section-head"><div><h3>Quick Actions</h3><p>Common license operations</p></div><div class="actions-row"><button class="btn primary2" onclick="openUserModal()">${icon('plus')}Add User</button><button class="btn" onclick="navigate('users')">${icon('users')}Manage Users</button><button class="btn" onclick="exportData('json')">${icon('download')}Backup</button></div></div><div class="list"><div class="list-item">${icon('refresh')}<div><strong>Live Firebase data</strong><p>Source: ${esc(CONFIG.USERS_NODE)}</p></div></div><div class="list-item">${icon('shield')}<div><strong>Local admin session</strong><p>Password is kept locally in this browser as a deterministic SHA-256 hash.</p></div></div></div></div><div class="section"><div class="section-head"><div><h3>Recent Activity</h3><p>Last 5 local admin actions</p></div><button class="btn" onclick="navigate('settings')">View Logs</button></div><div id="dashLogs"></div></div>`;renderDashLogs()}
function renderDashLogs(){const el=$('dashLogs');if(!el)return;const logs=getLogs().slice(0,5);el.innerHTML=logs.length?`<div class="list">${logs.map(l=>`<div class="list-item">${icon('shield')}<div><strong>${esc(l.action)}</strong><p>${esc(l.detail)} • ${esc(new Date(l.time).toLocaleString())}</p></div></div>`).join('')}</div>`:'<div class="empty">No activity yet.</div>'}
function visibleUsers(){const q=(document.getElementById('userSearch')?.value||'').toLowerCase();const f=document.getElementById('userFilter')?.value||'all';const sort=document.getElementById('userSort')?.value||'name';let arr=Object.entries(usersData).filter(([,u])=>u&&u.password!==undefined).map(([username,u])=>({username,u,status:statusOf(u)}));if(q)arr=arr.filter(x=>x.username.toLowerCase().includes(q)||(x.u.password||'').toLowerCase().includes(q));if(f!=='all')arr=arr.filter(x=>x.status===f);arr.sort((a,b)=>sort==='expiry'?(daysUntil(a.u.expire_date)-daysUntil(b.u.expire_date)):a.username.localeCompare(b.username));return arr}
function renderUsersPage(){const el=$('page-users');if(!el)return;el.innerHTML=`<div class="section"><div class="toolbar"><div class="search">${icon('search')}<input id="userSearch" placeholder="Search username or password…"></div><select id="userFilter" class="filter"><option value="all">All status</option><option value="active">Active</option><option value="soon">Expiring soon</option><option value="expired">Expired</option></select><select id="userSort" class="filter"><option value="name">Sort: Name</option><option value="expiry">Sort: Expiry</option></select><button class="btn primary2" onclick="openUserModal()">${icon('plus')}Add</button></div><div id="bulkbar" class="bulkbar"><span id="selectedCount">0 selected</span><button class="btn" onclick="bulkExtend(7)">+7d</button><button class="btn" onclick="bulkExtend(30)">+30d</button><button class="btn danger" onclick="bulkDelete()">Delete</button></div><div class="users" id="usersGrid"></div></div>`;['userSearch','userFilter','userSort'].forEach(id=>$(id).addEventListener(id==='userSearch'?'input':'change',renderUsersGrid));renderUsersGrid()}
function renderUsersGrid(){const grid=$('usersGrid');if(!grid)return;const arr=visibleUsers();$('bulkbar').classList.toggle('show',selected.size>0);$('selectedCount').textContent=`${selected.size} selected`;grid.innerHTML=arr.length?arr.map(({username,u,status})=>{const days=daysUntil(u.expire_date);const label=status==='expired'?'Expired':status==='soon'?`Expires in ${Math.max(days,0)}d`:'Active';return `<article class="user-card"><div class="user-head"><input class="check" type="checkbox" ${selected.has(username)?'checked':''} onchange="toggleSelect('${esc(username)}',this.checked)"><div class="avatar">${icon('users')}</div><div class="u-name">${esc(username)}</div><span class="badge ${status}">${label}</span></div><div class="card-info"><div class="info"><small>PASSWORD</small><b>${esc(u.password||'—')}</b></div><div class="info"><small>EXPIRY</small><b>${esc(u.expire_date||'—')}</b></div><div class="info"><small>TYPE</small><b>${esc(metaData[username]?.type||'Standard')}</b></div><div class="info"><small>DEVICE LIMIT</small><b>${esc(metaData[username]?.deviceLimit||'—')}</b></div></div><div class="card-actions"><button class="mini-btn" onclick="copyDetails('${esc(username)}')">${icon('copy')}Copy</button><button class="mini-btn" onclick="extendOne('${esc(username)}',7)">+7d</button><button class="mini-btn" onclick="openUserModal('${esc(username)}')">${icon('edit')}Edit</button><button class="mini-btn red" onclick="deleteUser('${esc(username)}')">${icon('trash')}</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">No users found.</div>'}
function toggleSelect(u,checked){checked?selected.add(u):selected.delete(u);renderUsersGrid()}
function inputField(label,id,val,type='text',cls=''){return `<div class="field ${cls}"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}" style="width:100%;height:48px;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:0 13px;color:var(--text);font-size:12px"></div>`}
function openUserModal(username=null){currentEdit=username;const u=username?usersData[username]:{};const m=username?(metaData[username]||{}):{};overlay.innerHTML=`<div class="modal"><div class="modal-head"><h3>${username?'Edit User':'Add User'}</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${inputField('USERNAME','mUsername',username||randomUser())}${inputField('PASSWORD','mPassword',u.password||randomPass())}${inputField('EXPIRY DATE','mExpiry',u.expire_date||futureDate(30),'date')}${inputField('USER TYPE','mType',m.type||'Standard')}${inputField('DEVICE LIMIT','mDevices',m.deviceLimit||'1','number')}${inputField('NOTE','mNote',m.note||'','text','full')}<div class="field full"><div class="danger-box">${username?'Changing the username moves the existing license node to the new username.':'The required Firebase fields remain exactly password + expire_date.'}</div></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary2" onclick="saveUser()">Save User</button></div></div>`;overlay.classList.add('show')}
function closeModal(){overlay.classList.remove('show');currentEdit=null}
function randomUser(){let s='';const c='abcdefghijklmnopqrstuvwxyz0123456789';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function randomPass(){let s='';const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function futureDate(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
async function put(path,data){return fetch(`${CONFIG.DB_URL}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
async function del(path){return fetch(`${CONFIG.DB_URL}/${path}.json`,{method:'DELETE'})}
function safeKey(s){return s.replace(/[.#$\[\]]/g,'')}
async function saveUser(){let username=safeKey($('mUsername').value.trim()),pass=$('mPassword').value.trim(),expiry=$('mExpiry').value;if(!username||!pass)return showToast('Username and password are required');const old=currentEdit;try{if(old&&old!==username)await del(`${CONFIG.USERS_NODE}/${old}`);let r=await put(`${CONFIG.USERS_NODE}/${username}`,{password:pass,expire_date:expiry});if(!r.ok)throw new Error('save');const meta={type:$('mType').value.trim()||'Standard',deviceLimit:$('mDevices').value||'1',note:$('mNote').value.trim(),updatedAt:Date.now()};await put(`${CONFIG.META_NODE}/${username}`,meta);if(old&&old!==username)await del(`${CONFIG.META_NODE}/${old}`);addLog(old?'Edit User':'Create User',`${old||username} • expiry ${expiry}`);closeModal();await fetchAll();showToast('User saved')}catch(e){showToast('Failed to save user; check Firebase rules')}}
async function deleteUser(username){if(!confirm(`Delete ${username} permanently?`))return;try{const r=await del(`${CONFIG.USERS_NODE}/${username}`);if(!r.ok)throw 0;await del(`${CONFIG.META_NODE}/${username}`);selected.delete(username);addLog('Delete User',username);await fetchAll();showToast('User deleted')}catch(e){showToast('Delete failed')}}
async function extendOne(username,days){const u=usersData[username];if(!u)return;let base=new Date();const current=new Date((u.expire_date||'1970-01-01')+'T23:59:59');if(current>base)base=current;base.setDate(base.getDate()+days);const expiry=base.toISOString().slice(0,10);try{const r=await put(`${CONFIG.USERS_NODE}/${username}`,{...u,expire_date:expiry});if(!r.ok)throw 0;addLog('Extend License',`${username} +${days}d → ${expiry}`);await fetchAll();showToast(`Extended ${username} by ${days} days`)}catch(e){showToast('Extension failed')}}
async function bulkExtend(days){const items=[...selected];if(!items.length)return;for(const u of items)await extendOne(u,days);selected.clear();renderUsersGrid()}
async function bulkDelete(){const items=[...selected];if(!items.length)return;if(!confirm(`Delete ${items.length} selected users?`))return;for(const u of items){await del(`${CONFIG.USERS_NODE}/${u}`);await del(`${CONFIG.META_NODE}/${u}`);addLog('Bulk Delete',u)}selected.clear();await fetchAll();showToast('Selected users deleted')}
async function copyDetails(username){const u=usersData[username];const text=`Username: ${username}\nPassword: ${u?.password||''}\nExpiry: ${u?.expire_date||''}`;try{await navigator.clipboard.writeText(text);showToast('Credentials copied')}catch{showToast('Clipboard unavailable')}}
function renderStats(){const el=$('page-stats');const c=counts();const logs=getLogs();const max=Math.max(c.total,1);const pct=n=>Math.round(n/max*100);el.innerHTML=`<div class="grid4">${statCard('ACTIVE RATE',pct(c.active)+'%','shield','Healthy licenses')}${statCard('EXPIRY RISK',pct(c.soon)+'%','bell','Within 7 days')}${statCard('EXPIRED RATE',pct(c.expired)+'%','calendar','Need renewal')}${statCard('LOCAL ACTIONS',logs.length,'chart','Stored in browser')}</div><div class="section"><div class="section-head"><div><h3>License Health</h3><p>Current distribution by expiry status</p></div></div><div class="list"><div class="list-item">${icon('shield')}<div style="flex:1"><strong>Active</strong><p>${c.active} users</p><div style="height:7px;background:var(--surface3);border-radius:99px;margin-top:7px;overflow:hidden"><div style="height:100%;width:${pct(c.active)}%;background:var(--success);border-radius:99px"></div></div></div></div><div class="list-item">${icon('bell')}<div style="flex:1"><strong>Expiring Soon</strong><p>${c.soon} users</p><div style="height:7px;background:var(--surface3);border-radius:99px;margin-top:7px;overflow:hidden"><div style="height:100%;width:${pct(c.soon)}%;background:var(--warning);border-radius:99px"></div></div></div></div><div class="list-item">${icon('calendar')}<div style="flex:1"><strong>Expired</strong><p>${c.expired} users</p><div style="height:7px;background:var(--surface3);border-radius:99px;margin-top:7px;overflow:hidden"><div style="height:100%;width:${pct(c.expired)}%;background:var(--danger);border-radius:99px"></div></div></div></div></div></div>`}
function renderNotifications(){const el=$('page-notifications');const arr=Object.entries(usersData).filter(([,u])=>u&&(['soon','expired'].includes(statusOf(u)))).sort((a,b)=>daysUntil(a[1].expire_date)-daysUntil(b[1].expire_date));el.innerHTML=`<div class="section"><div class="section-head"><div><h3>License Alerts</h3><p>${arr.length} users require attention</p></div><button class="btn" onclick="navigate('users')">Open Users</button></div><div class="list">${arr.length?arr.map(([u,x])=>{const d=daysUntil(x.expire_date);return `<div class="list-item">${icon(d<0?'calendar':'bell')}<div><strong>${esc(u)}</strong><p>${d<0?`Expired ${Math.abs(d)} day(s) ago`:`Expires in ${d} day(s)`} • ${esc(x.expire_date||'N/A')}</p></div><button class="btn" onclick="extendOne('${esc(u)}',7)">+7 days</button></div>`}).join(''):'<div class="empty">No expiry alerts.</div>'}</div></div>`}
function renderSettings(){const el=$('page-settings');el.innerHTML=`<div class="settings-grid"><div class="settings-card"><h3>Appearance</h3><p>Switch between white and black themes. The setting is saved locally.</p><div class="setting-row"><div><strong>Theme</strong><small>${theme==='light'?'White Theme':'Black Theme'}</small></div><label class="switch"><input id="themeSwitch" type="checkbox" ${theme==='light'?'checked':''}><span class="slider"></span></label></div><div class="setting-row"><div><strong>Primary Color</strong><small>Pick the panel accent</small></div><input id="primaryPicker" type="color" value="${primary}" style="width:44px;height:32px;border:0;background:transparent"></div></div><div class="settings-card"><h3>Security</h3><p>Local admin credentials are independent of Firebase user licenses.</p><div class="setting-row"><div><strong>Change Admin Password</strong><small>Updates this browser's local admin password</small></div><button class="btn" onclick="openPasswordModal()">Change</button></div><div class="setting-row"><div><strong>Session Timeout</strong><small>${CONFIG.SESSION_MINUTES} minutes</small></div>${icon('shield')}</div><div class="setting-row"><div><strong>Storage Key</strong><small>${CONFIG.ADMIN_HASH_KEY}</small></div></div></div><div class="settings-card"><h3>Data Management</h3><p>Backup your Firebase records and local panel metadata.</p><div class="actions-row"><button class="btn" onclick="exportData('json')">${icon('download')}JSON Backup</button><button class="btn" onclick="exportData('csv')">${icon('download')}CSV Export</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div></div><div class="settings-card"><h3>Activity Log</h3><p>Admin actions are stored locally in this browser.</p><div class="actions-row"><button class="btn" onclick="exportLogs()">${icon('download')}Export Logs</button><button class="btn danger" onclick="clearLogs()">Clear Logs</button></div></div></div>`;$('themeSwitch').onchange=e=>{theme=e.target.checked?'light':'dark';saveTheme();renderSettings()};$('primaryPicker').oninput=e=>{primary=e.target.value;saveTheme()}}
function openPasswordModal(){overlay.innerHTML=`<div class="modal"><div class="modal-head"><h3>Change Admin Password</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body">${inputField('CURRENT PASSWORD','oldAdmin','', 'password')}${inputField('NEW PASSWORD','newAdmin','', 'password')}${inputField('CONFIRM NEW PASSWORD','newAdmin2','', 'password')}<div class="danger-box">This password protects this browser only. Clearing site data or using another browser resets the local credential.</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary2" onclick="changeAdminPassword()">Update Password</button></div></div>`;overlay.classList.add('show')}
async function changeAdminPassword(){const old=$('oldAdmin').value,n=$('newAdmin').value,c=$('newAdmin2').value;if(await hash(old)!==localStorage.getItem(CONFIG.ADMIN_HASH_KEY))return showToast('Current password is wrong');if(n.length<6)return showToast('New password must be at least 6 characters');if(n!==c)return showToast('Passwords do not match');localStorage.setItem(CONFIG.ADMIN_HASH_KEY,await hash(n));addLog('Password Change','Local admin password changed');closeModal();showToast('Admin password updated')}
function downloadBlob(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportData(format){const pack={version:2,exportedAt:new Date().toISOString(),users:usersData,metadata:metaData};if(format==='json')downloadBlob('rf-license-backup.json',JSON.stringify(pack,null,2),'application/json');else{let csv='username,password,expire_date,type,device_limit,note\n';Object.entries(usersData).forEach(([u,x])=>{const m=metaData[u]||{};const vals=[u,x.password,x.expire_date,m.type,m.deviceLimit,m.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"');csv+=vals.join(',')+'\n'});downloadBlob('rf-license-export.csv',csv,'text/csv')};addLog('Export',format.toUpperCase()+' data export')}
function exportLogs(){downloadBlob('rf-license-activity.json',JSON.stringify(getLogs(),null,2),'application/json')}
function clearLogs(){if(!confirm('Clear all local activity logs?'))return;localStorage.removeItem(CONFIG.LOG_KEY);addLog('Clear Logs','Activity log was cleared');renderDashboard();renderSettings();showToast('Logs cleared')}
async function restoreBackup(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.users)return showToast('Invalid backup file');for(const [u,x] of Object.entries(data.users)){await put(`${CONFIG.USERS_NODE}/${safeKey(u)}`,x);if(data.metadata?.[u])await put(`${CONFIG.META_NODE}/${safeKey(u)}`,data.metadata[u])}addLog('Restore Backup',`${Object.keys(data.users).length} users restored`);await fetchAll();showToast('Backup restored')}catch(err){showToast('Restore failed')}}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
// startup
if(!isConfigured())renderAuth(true);else if(sessionValid()){loadPrefs();renderApp()}else renderAuth(false);
setInterval(()=>{if(sessionValid()){localStorage.setItem(CONFIG.SESSION_KEY,String(Date.now()))}else if(root.querySelector('.sidebar'))logout()},60000);
window.openUserModal=openUserModal;window.closeModal=closeModal;window.deleteUser=deleteUser;window.extendOne=extendOne;window.bulkExtend=bulkExtend;window.bulkDelete=bulkDelete;window.toggleSelect=toggleSelect;window.copyDetails=copyDetails;window.navigate=navigate;window.exportData=exportData;window.openPasswordModal=openPasswordModal;window.changeAdminPassword=changeAdminPassword;window.exportLogs=exportLogs;window.clearLogs=clearLogs;window.restoreBackup=restoreBackup;window.saveUser=saveUser;
</script>
</body>
</html>
